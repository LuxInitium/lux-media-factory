name: Render latest social video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/render.yml"

permissions:
  contents: write

concurrency:
  group: media-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow

      - name: Render vertical video
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/render.py 2>&1 | tee render.log

      - name: Save failure diagnostics
        if: steps.render.outcome == 'failure'
        run: |
          mkdir -p debug
          cp render.log debug/render.log
          git config user.name "lux-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug/render.log
          git commit -m "Save latest renderer diagnostics"
          git push

      - name: Stop after renderer failure
        if: steps.render.outcome == 'failure'
        run: exit 1

      - name: Publish stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view media-latest >/dev/null 2>&1; then
            gh release create media-latest --title "Latest Media Render" --notes "Automatically generated social-media output."
          fi
          gh release upload media-latest output/latest.mp4 output/cover.png --clobber
